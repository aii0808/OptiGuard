<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#0A0E17" />
    </linearGradient>
    <linearGradient id="redBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF334B" />
      <stop offset="100%" stopColor="#ED1C24" />
    </linearGradient>
    <radialGradient id="opticCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="50%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="transparent" />
    </radialGradient>
  </defs>

  <!-- Background Hexagon Shield -->
  <polygon
    points="32,4 58,18 58,46 32,60 6,46 6,18"
    fill="url(#shieldBg)"
    stroke="url(#redBorder)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Internal Optic Frame -->
  <polygon
    points="32,13 50,23 50,41 32,51 14,41 14,23"
    fill="#090E17"
    stroke="#ED1C24"
    stroke-width="1.2"
    opacity="0.8"
  />

  <!-- 8-Direction Fiber Optic Rays -->
  <line x1="32" y1="32" x2="32" y2="17" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" />
  <line x1="32" y1="32" x2="32" y2="47" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" />
  <line x1="32" y1="32" x2="17" y2="32" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" />
  <line x1="32" y1="32" x2="47" y2="32" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" />
  
  <line x1="32" y1="32" x2="21" y2="21" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="32" y1="32" x2="43" y2="43" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="32" y1="32" x2="21" y2="43" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
  <line x1="32" y1="32" x2="43" y2="21" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />

  <!-- Node Light Points -->
  <circle cx="32" cy="17" r="2.2" fill="#38BDF8" />
  <circle cx="32" cy="47" r="2.2" fill="#38BDF8" />
  <circle cx="17" cy="32" r="2.2" fill="#10B981" />
  <circle cx="47" cy="32" r="2.2" fill="#10B981" />
  <circle cx="21" cy="21" r="1.8" fill="#F59E0B" />
  <circle cx="43" cy="43" r="1.8" fill="#F59E0B" />
  <circle cx="21" cy="43" r="1.8" fill="#F59E0B" />
  <circle cx="43" cy="21" r="1.8" fill="#F59E0B" />

  <!-- Central Laser Core -->
  <circle cx="32" cy="32" r="6" fill="url(#opticCore)" />
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" />
</svg>
